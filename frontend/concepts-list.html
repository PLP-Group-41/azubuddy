<div id="concept-list" class="concept-list">
  <h3>Concepts</h3>
  <ul>
    <li><a href="#" data-concept-id="region-pairs" data-question="What is a region pair?">Region Pairs</a></li>
    <li><a href="#" data-concept-id="availability-zones" data-question="What are availability zones?">Availability Zones</a></li>
    <li><a href="#" data-concept-id="storage-redundancy" data-question="What is storage redundancy?">Storage Redundancy</a></li>
    <li><a href="#" data-concept-id="conditional-access" data-question="What is Conditional Access?">Conditional Access</a></li>
    <li><a href="#" data-concept-id="capex-vs-opex" data-question="What is CapEx vs OpEx?">CapEx vs OpEx</a></li>
  </ul>
</div>

<script>
  document.querySelectorAll('#concept-list a').forEach(a => {
    a.addEventListener('click', (e) => {
      e.preventDefault();

      const question = a.dataset.question;
      const conceptId = a.dataset.conceptId;
      const input = document.getElementById('question-input');

      if (input) {
        input.value = question;
        input.dataset.conceptId = conceptId;
        input.focus();
      }
    });
  });
</script>
